name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ephemeral_events_web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test --run
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    defaults:
      run:
        working-directory: ephemeral_events_web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Install backend deps
        working-directory: ephemeral_backend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm build
      - name: Run Playwright
        run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ephemeral_events_web/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshots
          path: ephemeral_events_web/e2e/specs/visual/*.visual.spec.ts-snapshots/
          retention-days: 30
