name = "ephemeral-events-web"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# Environment variables (BACKEND_URL, STRIPE_PUBLISHABLE_KEY, PINTEREST_APP_ID)
# are managed as Secrets in the Cloudflare Pages dashboard.
# See README.md for the full list of required environment variables.

